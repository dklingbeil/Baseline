[project]
name = "baseline-engine"
version = "0.1.0"
description = "Multimodal personal baseline engine: encoders, temporal baseline model, change detection."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
