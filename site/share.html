<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Share — Baseline</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="share-page">

  <!-- Hidden share page: open on your phone and hold it up to be scanned. Not linked from the site. -->
  <main class="share">
    <a class="brand share-brand" href="./" aria-label="Baseline home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 10.5h19" stroke="#121211" stroke-width="1.7" stroke-linecap="round"/><path d="M12 10.5l3.5 6h6" stroke="#c4532e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Baseline
    </a>

    <div class="share-stage" id="stage">
      <canvas id="qr" role="img" aria-label="QR code linking to the Baseline website"></canvas>
    </div>

    <div class="share-copy">
      <h1 class="share-title">Off your baseline?</h1>
      <p class="share-url mono" id="url"></p>
      <div class="share-actions">
        <button class="btn btn-primary" type="button" id="share-btn">Share link</button>
        <button class="btn btn-ghost" type="button" id="replay-btn">Replay</button>
      </div>
      <p class="share-status" id="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" crossorigin="anonymous"></script>
  <script src="assets/share.js"></script>
</body>
</html>
